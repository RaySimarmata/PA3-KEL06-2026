version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: gkm-gjm-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Jakarta
      - N8N_LOG_LEVEL=info
      # Groq API Key (from your .env)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/.n8n/workflows:ro
    networks:
      - gkm-gjm-network

  # Optional: PostgreSQL for n8n (recommended for production)
  # n8n-postgres:
  #   image: postgres:15-alpine
  #   container_name: gkm-gjm-n8n-db
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_USER=n8n
  #     - POSTGRES_PASSWORD=n8n_password
  #     - POSTGRES_DB=n8n
  #   volumes:
  #     - n8n_postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - gkm-gjm-network

volumes:
  n8n_data:
    driver: local
  # n8n_postgres_data:
  #   driver: local

networks:
  gkm-gjm-network:
    driver: bridge
